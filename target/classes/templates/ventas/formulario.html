<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Nueva Venta - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-receipt text-danger me-2"></i>Nueva venta</h4>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <form th:action="@{/ventas/guardar}" method="post" id="formVenta">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-md-5">
                    <div class="card-stat p-3 h-100">
                        <h6 class="fw-bold mb-3 text-danger">Datos generales</h6>
                        <div class="mb-3">
                            <label class="form-label">Cliente *</label>
                            <select name="clienteId" class="form-select bg-dark text-white border-secondary" required>
                                <option value="">Seleccionar cliente...</option>
                                <option th:each="c : ${clientes}" th:value="${c.id}"
                                        th:text="${c.nombreCompleto + ' - ' + c.cedula}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Método de pago *</label>
                            <select name="metodoPago" class="form-select bg-dark text-white border-secondary" required>
                                <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descuento ($)</label>
                            <input type="number" name="descuento" id="descuento" min="0" step="0.01" value="0"
                                   class="form-control bg-dark text-white border-secondary" onchange="calcularTotales()"/>
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card-stat p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold mb-0 text-danger">Productos</h6>
                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="agregarFila()">
                                <i class="bi bi-plus-lg me-1"></i>Agregar
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-dark table-sm mb-2" id="tablaProductos">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th style="width:80px;">Cant.</th>
                                        <th style="width:100px;">Precio</th>
                                        <th style="width:100px;">Subtotal</th>
                                        <th style="width:40px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="filasProductos">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card-stat p-3">
                        <div class="row justify-content-end">
                            <div class="col-md-4">
                                <table class="table table-dark table-sm mb-3">
                                    <tr>
                                        <td class="text-white-50">Subtotal</td>
                                        <td class="text-end">$ <span id="resSubtotal">0.00</span></td>
                                    </tr>
                                    <tr>
                                        <td class="text-white-50">Descuento</td>
                                        <td class="text-end">$ <span id="resDescuento">0.00</span></td>
                                    </tr>
                                    <tr>
                                        <td class="text-white-50">IVA (<span th:text="${#numbers.formatDecimal(tasaIva * 100, 1, 0)}"></span>%)</td>
                                        <td class="text-end">$ <span id="resIva">0.00</span></td>
                                    </tr>
                                    <tr class="fw-bold">
                                        <td>TOTAL</td>
                                        <td class="text-end text-danger fs-5">$ <span id="resTotal">0.00</span></td>
                                    </tr>
                                </table>
                                <button type="submit" class="btn btn-danger w-100">
                                    <i class="bi bi-floppy me-1"></i>Registrar venta
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
</div>

<script>
const productos = [
    <span th:each="p, i : ${productos}">
    { id: <span th:text="${p.id}"></span>, nombre: "<span th:text="${p.nombre + ' - ' + p.marca}"></span>", precio: <span th:text="${p.precio}"></span>, stock: <span th:text="${p.cantidad}"></span> }<span th:if="${!i.last}">,</span>
    </span>
];
const tasaIva = <span th:text="${tasaIva}"></span>;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>agregarFila();</script>
</body>
</html>
