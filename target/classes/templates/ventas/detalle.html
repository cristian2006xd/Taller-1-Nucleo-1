<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Detalle Venta - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">
                <i class="bi bi-receipt text-danger me-2"></i>
                Venta <span th:text="${venta.numeroComprobante}"></span>
            </h4>
            <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="row g-3">
            <div class="col-md-5">
                <div class="card-stat p-4">
                    <h6 class="fw-bold mb-3 text-danger">Datos de la venta</h6>
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-white-50">Comprobante</dt>
                        <dd class="col-sm-7" th:text="${venta.numeroComprobante}"></dd>
                        <dt class="col-sm-5 text-white-50">Fecha</dt>
                        <dd class="col-sm-7" th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}"></dd>
                        <dt class="col-sm-5 text-white-50">Cliente</dt>
                        <dd class="col-sm-7" th:text="${venta.cliente.nombreCompleto}"></dd>
                        <dt class="col-sm-5 text-white-50">Vendedor</dt>
                        <dd class="col-sm-7" th:text="${venta.usuario.nombreCompleto}"></dd>
                        <dt class="col-sm-5 text-white-50">Método pago</dt>
                        <dd class="col-sm-7"><span class="badge bg-secondary" th:text="${venta.metodoPago}"></span></dd>
                        <dt class="col-sm-5 text-white-50">Estado</dt>
                        <dd class="col-sm-7">
                            <span th:class="${venta.estado.name() == 'COMPLETADA'} ? 'badge bg-success' : 'badge bg-secondary'"
                                  th:text="${venta.estado}"></span>
                        </dd>
                        <dt class="col-sm-5 text-white-50">Subtotal</dt>
                        <dd class="col-sm-7">$ <span th:text="${#numbers.formatDecimal(venta.subtotal, 1, 2)}"></span></dd>
                        <dt class="col-sm-5 text-white-50">Descuento</dt>
                        <dd class="col-sm-7">$ <span th:text="${#numbers.formatDecimal(venta.descuento, 1, 2)}"></span></dd>
                        <dt class="col-sm-5 text-white-50">IVA</dt>
                        <dd class="col-sm-7">$ <span th:text="${#numbers.formatDecimal(venta.iva, 1, 2)}"></span></dd>
                        <dt class="col-sm-5 text-white-50 fw-bold">TOTAL</dt>
                        <dd class="col-sm-7 fw-bold text-danger fs-5">
                            $ <span th:text="${#numbers.formatDecimal(venta.total, 1, 2)}"></span>
                        </dd>
                    </dl>

                    <div class="mt-3" sec:authorize="hasRole('ADMIN')">
                        <form th:if="${venta.estado.name() == 'COMPLETADA'}"
                              th:action="@{/ventas/anular/{id}(id=${venta.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que deseas anular esta venta?')">
                                <i class="bi bi-x-circle me-1"></i>Anular venta
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card-stat p-4">
                    <h6 class="fw-bold mb-3 text-danger">Detalle de productos</h6>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover table-sm mb-0">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio unit.</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${detalles}">
                                    <td th:text="${d.producto.nombre}"></td>
                                    <td th:text="${d.cantidad}"></td>
                                    <td>$ <span th:text="${#numbers.formatDecimal(d.precioUnitario, 1, 2)}"></span></td>
                                    <td>$ <span th:text="${#numbers.formatDecimal(d.subtotal, 1, 2)}"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
