<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Ventas - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-receipt text-danger me-2"></i>Ventas</h4>
            <a th:href="@{/ventas/nueva}" class="btn btn-danger btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva venta
            </a>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <form th:action="@{/ventas}" method="get" class="row g-2 mb-3">
            <div class="col-12 col-md-5">
                <input type="text" name="busqueda" class="form-control form-control-sm bg-dark text-white border-secondary"
                       placeholder="Buscar por comprobante o cliente..." th:value="${busqueda}"/>
            </div>
            <div class="col-6 col-md-3">
                <select name="estado" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="">Todos los estados</option>
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                            th:selected="${e.name() == estadoSeleccionado}"></option>
                </select>
            </div>
            <div class="col-auto d-flex gap-2">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-search me-1"></i>Filtrar</button>
                <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
        </form>
        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Comprobante</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Pago</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${ventas}">
                            <td th:text="${v.numeroComprobante}"></td>
                            <td th:text="${v.cliente.nombreCompleto}"></td>
                            <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>$ <span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                            <td><span class="badge bg-secondary" th:text="${v.metodoPago}"></span></td>
                            <td>
                                <span th:class="${v.estado.name() == 'COMPLETADA'} ? 'badge bg-success' : 'badge bg-secondary'"
                                      th:text="${v.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/ventas/detalle/{id}(id=${v.id})}" class="btn btn-sm btn-outline-info">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="7" class="text-center text-white-50">No se encontraron ventas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${page.totalPages > 1}" class="d-flex justify-content-center mt-3">
                <nav>
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/ventas(pagina=${page.number - 1}, busqueda=${busqueda}, estado=${estadoSeleccionado})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            class="page-item" th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/ventas(pagina=${i}, busqueda=${busqueda}, estado=${estadoSeleccionado})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/ventas(pagina=${page.number + 1}, busqueda=${busqueda}, estado=${estadoSeleccionado})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
