<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Usuarios - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-person-gear text-danger me-2"></i>Usuarios</h4>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-danger btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo usuario
            </a>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <form th:action="@{/usuarios}" method="get" class="row g-2 mb-3">
            <div class="col-12 col-md-5">
                <input type="text" name="busqueda" class="form-control form-control-sm bg-dark text-white border-secondary"
                       placeholder="Buscar..." th:value="${busqueda}"/>
            </div>
            <div class="col-auto d-flex gap-2">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-search me-1"></i>Buscar</button>
                <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
        </form>
        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Nombre completo</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.nombreUsuario}"></td>
                            <td th:text="${u.nombreCompleto}"></td>
                            <td th:text="${u.correo}"></td>
                            <td><span class="badge bg-danger" th:text="${u.rol}"></span></td>
                            <td>
                                <span th:class="${u.activo} ? 'badge bg-success' : 'badge bg-secondary'"
                                      th:text="${u.activo ? 'Activo' : 'Inactivo'}"></span>
                            </td>
                            <td>
                                <a th:href="@{/usuarios/detalle/{id}(id=${u.id})}" class="btn btn-sm btn-outline-info me-1">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-warning me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/usuarios/toggle-activo/{id}(id=${u.id})}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-secondary me-1"
                                            th:title="${u.activo ? 'Desactivar' : 'Activar'}">
                                        <i th:class="${u.activo} ? 'bi bi-toggle-on' : 'bi bi-toggle-off'"></i>
                                    </button>
                                </form>
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                        th:data-id="${u.id}" th:data-nombre="${u.nombreUsuario}"
                                        onclick="prepararEliminar(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center text-white-50">No se encontraron usuarios</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">¿Eliminar al usuario <strong id="nombreEliminar"></strong>?</div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
