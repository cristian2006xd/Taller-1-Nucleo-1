<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Detalle Usuario - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-person-gear text-danger me-2"></i>Detalle del usuario</h4>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="card-stat p-4" style="max-width:500px;">
            <dl class="row mb-0">
                <dt class="col-sm-5 text-white-50">Nombre completo</dt>
                <dd class="col-sm-7" th:text="${usuario.nombreCompleto}"></dd>
                <dt class="col-sm-5 text-white-50">Usuario</dt>
                <dd class="col-sm-7" th:text="${usuario.nombreUsuario}"></dd>
                <dt class="col-sm-5 text-white-50">Correo</dt>
                <dd class="col-sm-7" th:text="${usuario.correo}"></dd>
                <dt class="col-sm-5 text-white-50">Rol</dt>
                <dd class="col-sm-7"><span class="badge bg-danger" th:text="${usuario.rol}"></span></dd>
                <dt class="col-sm-5 text-white-50">Estado</dt>
                <dd class="col-sm-7">
                    <span th:class="${usuario.activo} ? 'badge bg-success' : 'badge bg-secondary'"
                          th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span>
                </dd>
            </dl>
            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-warning btn-sm mt-3">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
