<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Ajuste - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-sliders text-info me-2"></i>Ajuste de inventario</h4>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="card-stat p-4" style="max-width:500px;">
            <form th:action="@{/inventario/ajuste}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Producto *</label>
                    <select name="productoId" class="form-select bg-dark text-white border-secondary" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="p : ${productos}" th:value="${p.id}"
                                th:text="${p.nombre + ' (Stock actual: ' + p.cantidad + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nueva cantidad *</label>
                    <input type="number" name="nuevaCantidad" min="0" required
                           class="form-control bg-dark text-white border-secondary"/>
                </div>
                <div class="mb-4">
                    <label class="form-label">Motivo *</label>
                    <input type="text" name="motivo" required
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="Conteo físico, corrección, etc."/>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-info">
                        <i class="bi bi-check-lg me-1"></i>Ajustar
                    </button>
                    <a th:href="@{/inventario}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
