<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Inventario - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-clipboard2-data text-danger me-2"></i>Inventario</h4>
            <div class="d-flex gap-2">
                <a th:href="@{/inventario/entrada}" class="btn btn-success btn-sm">
                    <i class="bi bi-arrow-down-circle me-1"></i>Entrada
                </a>
                <a th:href="@{/inventario/salida}" class="btn btn-warning btn-sm">
                    <i class="bi bi-arrow-up-circle me-1"></i>Salida
                </a>
                <a th:href="@{/inventario/ajuste}" class="btn btn-info btn-sm" sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-sliders me-1"></i>Ajuste
                </a>
            </div>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <div th:if="${!#lists.isEmpty(agotados)}" class="alert alert-danger py-2 mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${agotados.size()}"></strong> producto(s) agotado(s).
        </div>
        <div th:if="${!#lists.isEmpty(stockBajo)}" class="alert alert-warning py-2 mb-3">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <strong th:text="${stockBajo.size()}"></strong> producto(s) con stock bajo.
        </div>

        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Cantidad</th>
                            <th>Motivo</th>
                            <th>Usuario</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${movimientos}">
                            <td th:text="${m.producto.nombre}"></td>
                            <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span th:class="${m.tipo.name() == 'ENTRADA' or m.tipo.name() == 'ANULACION'} ? 'badge bg-success' : (${m.tipo.name() == 'AJUSTE'} ? 'badge bg-info' : 'badge bg-danger')"
                                      th:text="${m.tipo}"></span>
                            </td>
                            <td th:text="${m.cantidad}"></td>
                            <td th:text="${m.motivo} ?: '-'"></td>
                            <td th:text="${m.usuario != null ? m.usuario.nombreUsuario : '-'}"></td>
                        </tr>
                        <tr th:if="${movimientos.content == null or #lists.isEmpty(movimientos.content)}">
                            <td colspan="6" class="text-center text-white-50">No hay movimientos</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
