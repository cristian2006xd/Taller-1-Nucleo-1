<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Productos - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-box-seam text-danger me-2"></i>Productos</h4>
            <a th:href="@{/productos/nuevo}" class="btn btn-danger btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo producto
            </a>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <form th:action="@{/productos}" method="get" class="row g-2 mb-3">
            <div class="col-12 col-md-4">
                <input type="text" name="busqueda" class="form-control form-control-sm bg-dark text-white border-secondary"
                       placeholder="Buscar por nombre, código o marca..." th:value="${busqueda}"/>
            </div>
            <div class="col-6 col-md-2">
                <select name="tipo" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="">Todos los tipos</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                            th:selected="${t.name() == tipoSeleccionado}"></option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <select name="categoriaId" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="">Todas las categorías</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                            th:selected="${c.id == categoriaId}"></option>
                </select>
            </div>
            <div class="col-12 col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-danger btn-sm flex-grow-1">
                    <i class="bi bi-search me-1"></i>Filtrar
                </button>
                <a th:href="@{/productos}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </form>

        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Marca</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.codigo}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td><span class="badge bg-secondary" th:text="${p.tipo}"></span></td>
                            <td th:text="${p.marca}"></td>
                            <td>$ <span th:text="${#numbers.formatDecimal(p.precio, 1, 2)}"></span></td>
                            <td>
                                <span th:class="${p.cantidad <= p.stockMinimo} ? 'badge bg-danger' : 'badge bg-success'"
                                      th:text="${p.cantidad}"></span>
                            </td>
                            <td>
                                <span th:class="${p.estado.name() == 'ACTIVO'} ? 'badge bg-success' : 'badge bg-secondary'"
                                      th:text="${p.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/productos/detalle/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info me-1" title="Detalle">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning me-1" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                        th:data-id="${p.id}" th:data-nombre="${p.nombre}"
                                        onclick="prepararEliminar(this)" sec:authorize="hasRole('ADMIN')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="8" class="text-center text-white-50">No se encontraron productos</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${page.totalPages > 1}" class="d-flex justify-content-center mt-3">
                <nav>
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/productos(pagina=${page.number - 1}, busqueda=${busqueda}, tipo=${tipoSeleccionado}, categoriaId=${categoriaId})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            class="page-item" th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/productos(pagina=${i}, busqueda=${busqueda}, tipo=${tipoSeleccionado}, categoriaId=${categoriaId})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/productos(pagina=${page.number + 1}, busqueda=${busqueda}, tipo=${tipoSeleccionado}, categoriaId=${categoriaId})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">¿Eliminar el producto <strong id="nombreEliminar"></strong>?</div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
