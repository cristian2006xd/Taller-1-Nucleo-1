<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Dashboard - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">

<div th:replace="~{fragmentos/navbar :: navbar}"></div>

<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="mb-4 fw-bold"><i class="bi bi-speedometer2 text-danger me-2"></i>Dashboard</h4>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-lg-2">
                <div class="card-stat text-center p-3">
                    <i class="bi bi-motorcycle text-danger fs-3"></i>
                    <div class="stat-number" th:text="${totalMotos}">0</div>
                    <div class="stat-label">Motos</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="card-stat text-center p-3">
                    <i class="bi bi-gear text-warning fs-3"></i>
                    <div class="stat-number" th:text="${totalRepuestos}">0</div>
                    <div class="stat-label">Repuestos</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="card-stat text-center p-3">
                    <i class="bi bi-shield-check text-info fs-3"></i>
                    <div class="stat-number" th:text="${totalAccesorios}">0</div>
                    <div class="stat-label">Accesorios</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="card-stat text-center p-3">
                    <i class="bi bi-people text-success fs-3"></i>
                    <div class="stat-number" th:text="${totalClientes}">0</div>
                    <div class="stat-label">Clientes</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="card-stat text-center p-3">
                    <i class="bi bi-receipt text-primary fs-3"></i>
                    <div class="stat-number" th:text="${totalVentas}">0</div>
                    <div class="stat-label">Ventas</div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="card-stat text-center p-3">
                    <i class="bi bi-exclamation-triangle text-danger fs-3"></i>
                    <div class="stat-number" th:text="${stockBajo}">0</div>
                    <div class="stat-label">Stock Bajo</div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card-stat p-3">
                    <div class="text-white-50 small mb-1">Valor total de ventas</div>
                    <div class="fs-4 fw-bold text-success">
                        $ <span th:text="${#numbers.formatDecimal(valorVentas, 1, 2)}">0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card-stat p-3">
                    <div class="text-white-50 small mb-1">Valor del inventario (costo)</div>
                    <div class="fs-4 fw-bold text-warning">
                        $ <span th:text="${#numbers.formatDecimal(valorInventario, 1, 2)}">0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-stat p-3">
            <h6 class="fw-bold mb-3"><i class="bi bi-clock-history me-2 text-danger"></i>Últimas 5 ventas</h6>
            <div class="table-responsive">
                <table class="table table-dark table-hover table-sm mb-0">
                    <thead>
                        <tr>
                            <th>Comprobante</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${ultimasVentas}">
                            <td>
                                <a th:href="@{/ventas/detalle/{id}(id=${v.id})}"
                                   class="text-danger text-decoration-none" th:text="${v.numeroComprobante}"></a>
                            </td>
                            <td th:text="${v.cliente.nombreCompleto}"></td>
                            <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>$ <span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                            <td>
                                <span th:class="${v.estado.name() == 'COMPLETADA'} ? 'badge bg-success' : 'badge bg-secondary'"
                                      th:text="${v.estado}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ultimasVentas)}">
                            <td colspan="5" class="text-center text-white-50">No hay ventas registradas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
