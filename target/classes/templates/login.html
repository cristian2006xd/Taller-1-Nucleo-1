<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Rueda Libre Motos - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow-lg" style="width:100%;max-width:420px;background:#1a1a1a;border:1px solid #333;">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <i class="bi bi-motorcycle text-danger" style="font-size:3rem;"></i>
            <h4 class="text-white mt-2 fw-bold">Rueda Libre Motos</h4>
            <p class="text-secondary small">Sistema de gestión</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2">
            <i class="bi bi-check-circle-fill me-2"></i>Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label text-white-50 small">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary"
                           placeholder="Nombre de usuario" required autofocus/>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-white-50 small">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary"
                           placeholder="Contraseña" required/>
                </div>
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
