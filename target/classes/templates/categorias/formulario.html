<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Categoría - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="fw-bold mb-4">
            <i class="bi bi-tags text-danger me-2"></i>
            <span th:text="${categoria.id} != null ? 'Editar categoría' : 'Nueva categoría'"></span>
        </h4>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="card-stat p-4" style="max-width:500px;">
            <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text" th:field="*{nombre}" class="form-control bg-dark text-white border-secondary"
                           th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" rows="3"
                              class="form-control bg-dark text-white border-secondary"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-floppy me-1"></i>Guardar
                    </button>
                    <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
