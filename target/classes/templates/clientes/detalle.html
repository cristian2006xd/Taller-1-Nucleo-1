<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Detalle Cliente - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-people text-danger me-2"></i>Detalle del cliente</h4>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="row g-3">
            <div class="col-md-5">
                <div class="card-stat p-4 h-100">
                    <h6 class="fw-bold mb-3 text-danger">Información personal</h6>
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-white-50">Cédula</dt>
                        <dd class="col-sm-7" th:text="${cliente.cedula}"></dd>
                        <dt class="col-sm-5 text-white-50">Nombres</dt>
                        <dd class="col-sm-7" th:text="${cliente.nombres}"></dd>
                        <dt class="col-sm-5 text-white-50">Apellidos</dt>
                        <dd class="col-sm-7" th:text="${cliente.apellidos}"></dd>
                        <dt class="col-sm-5 text-white-50">Teléfono</dt>
                        <dd class="col-sm-7" th:text="${cliente.telefono} ?: '-'"></dd>
                        <dt class="col-sm-5 text-white-50">Correo</dt>
                        <dd class="col-sm-7" th:text="${cliente.correo} ?: '-'"></dd>
                        <dt class="col-sm-5 text-white-50">Dirección</dt>
                        <dd class="col-sm-7" th:text="${cliente.direccion} ?: '-'"></dd>
                    </dl>
                    <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-warning btn-sm mt-3">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card-stat p-4">
                    <h6 class="fw-bold mb-3 text-danger">Historial de compras</h6>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover table-sm mb-0">
                            <thead>
                                <tr>
                                    <th>Comprobante</th>
                                    <th>Fecha</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${ventas}">
                                    <td>
                                        <a th:href="@{/ventas/detalle/{id}(id=${v.id})}"
                                           class="text-danger text-decoration-none" th:text="${v.numeroComprobante}"></a>
                                    </td>
                                    <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy')}"></td>
                                    <td>$ <span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                                    <td>
                                        <span th:class="${v.estado.name() == 'COMPLETADA'} ? 'badge bg-success' : 'badge bg-secondary'"
                                              th:text="${v.estado}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(ventas)}">
                                    <td colspan="4" class="text-center text-white-50">Sin compras registradas</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
