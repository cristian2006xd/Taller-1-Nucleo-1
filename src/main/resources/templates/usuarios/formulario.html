<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Usuario - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="fw-bold mb-4">
            <i class="bi bi-person-gear text-danger me-2"></i>
            <span th:text="${usuario.id} != null ? 'Editar usuario' : 'Nuevo usuario'"></span>
        </h4>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="card-stat p-4" style="max-width:600px;">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre completo *</label>
                        <input type="text" th:field="*{nombreCompleto}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('nombreCompleto')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nombreCompleto}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre de usuario *</label>
                        <input type="text" th:field="*{nombreUsuario}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('nombreUsuario')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nombreUsuario}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo *</label>
                        <input type="email" th:field="*{correo}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('correo')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{correo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            Contraseña <span th:text="${usuario.id} != null ? '(vacío = mantener)' : '*'"></span>
                        </label>
                        <input type="password" name="nuevaContrasena"
                               class="form-control bg-dark text-white border-secondary"
                               autocomplete="new-password"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rol *</label>
                        <select th:field="*{rol}" class="form-select bg-dark text-white border-secondary"
                                th:classappend="${#fields.hasErrors('rol')} ? ' is-invalid'">
                            <option value="">Seleccionar...</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{rol}"></div>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activoCheck"/>
                            <label class="form-check-label" for="activoCheck">Usuario activo</label>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-floppy me-1"></i>Guardar
                    </button>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
