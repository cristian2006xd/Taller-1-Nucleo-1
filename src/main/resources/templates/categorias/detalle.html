<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Detalle Categoría - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-tags text-danger me-2"></i>Detalle de categoría</h4>
            <a th:href="@{/categorias}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="card-stat p-4" style="max-width:500px;">
            <dl class="row mb-0">
                <dt class="col-sm-4 text-white-50">ID</dt>
                <dd class="col-sm-8" th:text="${categoria.id}"></dd>
                <dt class="col-sm-4 text-white-50">Nombre</dt>
                <dd class="col-sm-8" th:text="${categoria.nombre}"></dd>
                <dt class="col-sm-4 text-white-50">Descripción</dt>
                <dd class="col-sm-8" th:text="${categoria.descripcion} ?: '-'"></dd>
                <dt class="col-sm-4 text-white-50">Productos</dt>
                <dd class="col-sm-8" th:text="${categoria.productos != null ? categoria.productos.size() : 0}"></dd>
            </dl>
            <div class="mt-3">
                <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}" class="btn btn-warning btn-sm me-2">
                    <i class="bi bi-pencil me-1"></i>Editar
                </a>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
