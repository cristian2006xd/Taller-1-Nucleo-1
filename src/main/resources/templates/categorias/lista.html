<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Categorías - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-tags text-danger me-2"></i>Categorías</h4>
            <a th:href="@{/categorias/nuevo}" class="btn btn-danger btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva categoría
            </a>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Productos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c, i : ${categorias}">
                            <td th:text="${i.count}"></td>
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.descripcion} ?: '-'"></td>
                            <td th:text="${c.productos != null ? c.productos.size() : 0}"></td>
                            <td>
                                <a th:href="@{/categorias/detalle/{id}(id=${c.id})}" class="btn btn-sm btn-outline-info me-1" title="Detalle">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-warning me-1" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                        th:data-id="${c.id}" th:data-nombre="${c.nombre}"
                                        onclick="prepararEliminar(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="5" class="text-center text-white-50">No hay categorías registradas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                ¿Eliminar la categoría <strong id="nombreEliminar"></strong>?
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
