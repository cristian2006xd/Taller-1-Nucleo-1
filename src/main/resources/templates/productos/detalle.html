<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Detalle Producto - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-box-seam text-danger me-2"></i>Detalle del producto</h4>
            <a th:href="@{/productos}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="card-stat p-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-white-50">Código</dt>
                        <dd class="col-sm-7" th:text="${producto.codigo}"></dd>
                        <dt class="col-sm-5 text-white-50">Nombre</dt>
                        <dd class="col-sm-7" th:text="${producto.nombre}"></dd>
                        <dt class="col-sm-5 text-white-50">Tipo</dt>
                        <dd class="col-sm-7"><span class="badge bg-secondary" th:text="${producto.tipo}"></span></dd>
                        <dt class="col-sm-5 text-white-50">Marca</dt>
                        <dd class="col-sm-7" th:text="${producto.marca}"></dd>
                        <dt class="col-sm-5 text-white-50">Modelo</dt>
                        <dd class="col-sm-7" th:text="${producto.modelo} ?: '-'"></dd>
                        <dt class="col-sm-5 text-white-50">Categoría</dt>
                        <dd class="col-sm-7" th:text="${producto.categoria != null ? producto.categoria.nombre : '-'}"></dd>
                        <dt class="col-sm-5 text-white-50">Estado</dt>
                        <dd class="col-sm-7">
                            <span th:class="${producto.estado.name() == 'ACTIVO'} ? 'badge bg-success' : 'badge bg-secondary'"
                                  th:text="${producto.estado}"></span>
                        </dd>
                    </dl>
                </div>
                <div class="col-md-6">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-white-50">Precio compra</dt>
                        <dd class="col-sm-7">$ <span th:text="${#numbers.formatDecimal(producto.precioCompra, 1, 2)}"></span></dd>
                        <dt class="col-sm-5 text-white-50">Precio venta</dt>
                        <dd class="col-sm-7">$ <span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}"></span></dd>
                        <dt class="col-sm-5 text-white-50">Stock</dt>
                        <dd class="col-sm-7">
                            <span th:class="${producto.cantidad <= producto.stockMinimo} ? 'badge bg-danger' : 'badge bg-success'"
                                  th:text="${producto.cantidad}"></span>
                        </dd>
                        <dt class="col-sm-5 text-white-50">Stock mínimo</dt>
                        <dd class="col-sm-7" th:text="${producto.stockMinimo}"></dd>
                        <dt class="col-sm-5 text-white-50">Color</dt>
                        <dd class="col-sm-7" th:text="${producto.color} ?: '-'"></dd>
                        <dt class="col-sm-5 text-white-50">Cilindraje</dt>
                        <dd class="col-sm-7" th:text="${producto.cilindraje != null ? producto.cilindraje + ' cc' : '-'}"></dd>
                        <dt class="col-sm-5 text-white-50">Año</dt>
                        <dd class="col-sm-7" th:text="${producto.anio} ?: '-'"></dd>
                        <dt class="col-sm-5 text-white-50">VIN</dt>
                        <dd class="col-sm-7" th:text="${producto.vin} ?: '-'"></dd>
                    </dl>
                </div>
                <div class="col-12">
                    <span class="text-white-50 small">Descripción:</span>
                    <p th:text="${producto.descripcion} ?: 'Sin descripción'" class="mb-0 mt-1"></p>
                </div>
            </div>
            <div class="mt-3">
                <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-warning btn-sm me-2">
                    <i class="bi bi-pencil me-1"></i>Editar
                </a>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
