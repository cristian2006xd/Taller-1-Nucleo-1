<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Producto - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="fw-bold mb-4">
            <i class="bi bi-box-seam text-danger me-2"></i>
            <span th:text="${producto.id} != null ? 'Editar producto' : 'Nuevo producto'"></span>
        </h4>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="card-stat p-4">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Código *</label>
                        <input type="text" th:field="*{codigo}" class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('codigo')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{codigo}"></div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Nombre *</label>
                        <input type="text" th:field="*{nombre}" class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo *</label>
                        <select th:field="*{tipo}" id="tipoSelect" class="form-select bg-dark text-white border-secondary"
                                th:classappend="${#fields.hasErrors('tipo')} ? ' is-invalid'" onchange="toggleCamposMoto()">
                            <option value="">Seleccionar...</option>
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Marca *</label>
                        <input type="text" th:field="*{marca}" class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('marca')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{marca}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Modelo</label>
                        <input type="text" th:field="*{modelo}" class="form-control bg-dark text-white border-secondary"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Categoría</label>
                        <select th:field="*{categoria.id}" class="form-select bg-dark text-white border-secondary">
                            <option value="">Sin categoría</option>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Precio compra *</label>
                        <input type="number" step="0.01" min="0" th:field="*{precioCompra}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('precioCompra')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{precioCompra}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Precio venta *</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{precio}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('precio')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{precio}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad *</label>
                        <input type="number" min="0" th:field="*{cantidad}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('cantidad')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{cantidad}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Stock mínimo *</label>
                        <input type="number" min="0" th:field="*{stockMinimo}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('stockMinimo')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{stockMinimo}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Estado</label>
                        <select th:field="*{estado}" class="form-select bg-dark text-white border-secondary">
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Color</label>
                        <input type="text" th:field="*{color}" class="form-control bg-dark text-white border-secondary"/>
                    </div>

                    <div id="camposMoto" class="col-12">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Cilindraje (cc)</label>
                                <input type="number" min="0" th:field="*{cilindraje}"
                                       class="form-control bg-dark text-white border-secondary"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Año</label>
                                <input type="number" min="1900" max="2099" th:field="*{anio}"
                                       class="form-control bg-dark text-white border-secondary"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">VIN (solo motos)</label>
                                <input type="text" th:field="*{vin}" maxlength="17"
                                       class="form-control bg-dark text-white border-secondary"/>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" rows="2"
                                  class="form-control bg-dark text-white border-secondary"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-floppy me-1"></i>Guardar
                    </button>
                    <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>toggleCamposMoto();</script>
</body>
</html>
