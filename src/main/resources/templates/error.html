<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="text-center px-3" style="max-width:500px;">
    <i class="bi bi-exclamation-octagon text-danger" style="font-size:4rem;"></i>
    <h3 class="mt-3 fw-bold" th:text="${titulo} ?: 'Error'"></h3>
    <p class="text-white-50 mt-2" th:text="${mensaje} ?: 'Ocurrió un error inesperado.'"></p>
    <a th:href="@{/dashboard}" class="btn btn-danger mt-3">
        <i class="bi bi-house me-1"></i>Volver al inicio
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
