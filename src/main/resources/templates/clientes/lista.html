<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Clientes - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-people text-danger me-2"></i>Clientes</h4>
            <a th:href="@{/clientes/nuevo}" class="btn btn-danger btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo cliente
            </a>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <form th:action="@{/clientes}" method="get" class="row g-2 mb-3">
            <div class="col-12 col-md-5">
                <input type="text" name="busqueda" class="form-control form-control-sm bg-dark text-white border-secondary"
                       placeholder="Buscar por cédula, nombre o correo..." th:value="${busqueda}"/>
            </div>
            <div class="col-auto d-flex gap-2">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-search me-1"></i>Buscar</button>
                <a th:href="@{/clientes}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
            </div>
        </form>
        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.cedula}"></td>
                            <td th:text="${c.nombreCompleto}"></td>
                            <td th:text="${c.telefono} ?: '-'"></td>
                            <td th:text="${c.correo} ?: '-'"></td>
                            <td>
                                <a th:href="@{/clientes/detalle/{id}(id=${c.id})}" class="btn btn-sm btn-outline-info me-1">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-warning me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                        th:data-id="${c.id}" th:data-nombre="${c.nombreCompleto}"
                                        onclick="prepararEliminar(this)" sec:authorize="hasRole('ADMIN')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="5" class="text-center text-white-50">No se encontraron clientes</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${page.totalPages > 1}" class="d-flex justify-content-center mt-3">
                <nav>
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/clientes(pagina=${page.number - 1}, busqueda=${busqueda})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            class="page-item" th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/clientes(pagina=${i}, busqueda=${busqueda})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link bg-dark text-white border-secondary"
                               th:href="@{/clientes(pagina=${page.number + 1}, busqueda=${busqueda})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>
<div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">¿Eliminar al cliente <strong id="nombreEliminar"></strong>?</div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
