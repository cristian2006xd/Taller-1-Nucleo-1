<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cliente - Rueda Libre Motos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body class="bg-dark text-white">
<div th:replace="~{fragmentos/navbar :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>
    <main class="flex-grow-1 p-4">
        <h4 class="fw-bold mb-4">
            <i class="bi bi-people text-danger me-2"></i>
            <span th:text="${cliente.id} != null ? 'Editar cliente' : 'Nuevo cliente'"></span>
        </h4>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>
        <div class="card-stat p-4" style="max-width:700px;">
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Cédula *</label>
                        <input type="text" th:field="*{cedula}" maxlength="10"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('cedula')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{cedula}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nombres *</label>
                        <input type="text" th:field="*{nombres}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('nombres')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nombres}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Apellidos *</label>
                        <input type="text" th:field="*{apellidos}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('apellidos')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}"
                               class="form-control bg-dark text-white border-secondary"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Correo</label>
                        <input type="email" th:field="*{correo}"
                               class="form-control bg-dark text-white border-secondary"
                               th:classappend="${#fields.hasErrors('correo')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{correo}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Dirección</label>
                        <input type="text" th:field="*{direccion}"
                               class="form-control bg-dark text-white border-secondary"/>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-floppy me-1"></i>Guardar
                    </button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
