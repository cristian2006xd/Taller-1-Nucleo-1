spring.application.name=ruedalibre

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ruedalibre_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.port=8080

app.iva=0.15

logging.level.com.ruedalibre=DEBUG
logging.level.org.springframework.security=INFO
